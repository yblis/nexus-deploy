# ============================================================
# Nexus RMM — Production Deployment
# ============================================================
# Prérequis : Docker Engine 24+ et Docker Compose v2
#
# Installation :
#   1. cp .env.example .env
#   2. Éditer .env avec vos paramètres
#   3. docker compose pull
#   4. docker compose up -d
#
# Mise à jour :
#   docker compose pull && docker compose up -d
# ============================================================

services:
  # ──────────────────────────────────────────────
  # PostgreSQL 16
  # ──────────────────────────────────────────────
  nexus-db:
    image: pgvector/pgvector:pg16
    container_name: nexus-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - nexus-db-data:/var/lib/postgresql/data
    networks:
      - nexus-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # Backend API
  # ──────────────────────────────────────────────
  nexus-api:
    image: ghcr.io/yblis/nexus-api:${NEXUS_VERSION:-latest}
    container_name: nexus-api
    restart: unless-stopped
    environment:
      DB_HOST: nexus-db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      API_PORT: ${API_PORT:-8080}
      NEXUS_DOMAIN: ${NEXUS_DOMAIN}
      NEXUS_SERVER_IP: ${NEXUS_SERVER_IP:-}
    volumes:
      # Pas de volume sur /app/binaries : les binaires des agents et l'APK Android
      # sont livres dans l'image. Un volume nomme masque definitivement le contenu
      # de l'image apres sa premiere creation — Docker ne le repeuple que s'il est
      # vide — donc les agents restaient figes a la version du premier deploiement.
      # Rien n'ecrit dans ce repertoire a l'execution, il est uniquement lu.
      - nexus-tools:/app/tools
      - nexus-branding:/app/branding
      - nexus-applications:/app/applications
      - nexus-uploads:/app/uploads
      - nexus-filedeploy:/app/filedeploy
    tmpfs:
      - /tmp/nexus-chat:size=100M
    depends_on:
      nexus-db:
        condition: service_healthy
    networks:
      - nexus-net

  # ──────────────────────────────────────────────
  # Frontend Dashboard
  # ──────────────────────────────────────────────
  nexus-web:
    image: ghcr.io/yblis/nexus-web:${NEXUS_VERSION:-latest}
    container_name: nexus-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3333}:80"
    depends_on:
      - nexus-api
    networks:
      - nexus-net

  # ──────────────────────────────────────────────
  # Nexus Network Relay (optionnel — profil "relay")
  # Chemin de secours quand le P2P échoue entre agents
  # Activation : docker compose --profile relay up -d
  # ──────────────────────────────────────────────
  nexus-relay:
    image: ghcr.io/yblis/nexus-relay:${NEXUS_VERSION:-latest}
    container_name: nexus-relay
    restart: unless-stopped
    profiles:
      - relay
    environment:
      NEXUS_SERVER_URL: ${NEXUS_RELAY_SERVER_URL:-http://nexus-api:8080}
      NEXUS_RELAY_ID: ${NEXUS_RELAY_ID}
      NEXUS_RELAY_TOKEN: ${NEXUS_RELAY_TOKEN}
      NEXUS_RELAY_QUIC_ADDR: ":51821"
      NEXUS_RELAY_WSS_ADDR: ":8443"
      NEXUS_RELAY_STUN_ADDR: ":3478"
      NEXUS_RELAY_CERT: ${NEXUS_RELAY_CERT:-}
      NEXUS_RELAY_KEY: ${NEXUS_RELAY_KEY:-}
      NEXUS_ALLOW_INSECURE: ${NEXUS_RELAY_ALLOW_INSECURE:-}
    ports:
      - "${NEXUS_RELAY_QUIC_PORT:-51821}:51821/udp"
      - "${NEXUS_RELAY_STUN_PORT:-3478}:3478/udp"
      - "${NEXUS_RELAY_WSS_PORT:-8443}:8443/tcp"
    depends_on:
      - nexus-api
    networks:
      - nexus-net
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1:8443/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  nexus-db-data:
  nexus-tools:
  nexus-branding:
  nexus-applications:
  nexus-uploads:
  nexus-filedeploy:

networks:
  nexus-net:
    driver: bridge
